name: Build and push Docker image to GitHub Container Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/mbenaibei/ghcr-lab-alpine:latest .

      - name: Push image
        run: docker push ghcr.io/mbenaibei/ghcr-lab-alpine:latest




name: Build and push Dockerimage to GitHub Container Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker build . --file Dockerfile --tag ghcr.io/mbenaibei/ghcr-lab-alpine:latest
          docker push ghcr.io/mbenaibei/ghcr-lab-alpine:latest

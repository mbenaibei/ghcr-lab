name: Build and push Dockerimage to GitHub Container Registry

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker build . --file Dockerfile --tag ghcr.io/mbenaibei/ghcr-lab-alpine:$(date %s)

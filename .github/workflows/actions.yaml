name: Build and push Docker image to GitHub Container Registry

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: tru

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/mbenaibei/ghcr-lab-alpine:latest .

      - name: Push image
        run: docker push ghcr.io/mbenaibei/ghcr-lab-alpine:latest
